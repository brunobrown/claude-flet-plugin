Critical checks:
- `@ft.control(\"Name\")` must match Dart `control.type` exactly.
- Service vs UI control patterns must be correct (`page.services.append()` vs `page.add()`).
- Python/Dart type mapping must be explicit and safe; events: `triggerEvent(\"name\")` -> `on_name`.

Flet 0.85.x integration awareness:
- Companion extensions evolved: flet-video (configurable controls + `take_screenshot()`); flet-audio (`AudioRecorder` with PCM16 streaming + direct upload). Mirror these patterns for media extensions.
