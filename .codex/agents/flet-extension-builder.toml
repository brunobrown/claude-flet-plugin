- DragTargetEvent migration: replace `.x` / `.y` / `.offset` with `local_position` / `global_position` (deprecated 0.85.0, removal 0.88.0).
- For dialogs from UI controls, prefer `ft.use_dialog(dialog)` over imperative `page.show_dialog(...)`.
- Don't assume `page.go(...)` in helper code — it's deprecated; use `page.navigate(...)` / `await page.push_route(...)`.
